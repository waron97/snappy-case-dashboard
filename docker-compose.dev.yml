services:
  gateway:
    image: nginx:alpine
    ports:
      - "${PORT}:80"
    environment:
      PORT: ${PORT}
    volumes:
      - ./nginx.conf:/etc/nginx/templates/nginx.conf.template
      - /dev/null:/etc/nginx/conf.d/default.conf
    depends_on:
      - web
      - lsp-server

  web:
    build:
      context: ./web-app
      dockerfile: Dockerfile.dev
      args:
        ODOO_URL: ${ODOO_URL}
    command: yarn run dev
    restart: unless-stopped
    env_file:
      - ./.env
    volumes:
      - ./web-app/app:/app/app
      - ./web-app/src:/app/src

  lsp-server:
    build: ./lsp-server
    restart: unless-stopped
