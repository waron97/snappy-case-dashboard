services:
  gateway:
    image: nginx:alpine
    ports:
      - "${PORT}:80"
    environment:
      PORT: ${PORT}
    volumes:
      - ./nginx.conf:/etc/nginx/templates/nginx.conf.template
      - /dev/null:/etc/nginx/conf.d/default.conf
    depends_on:
      - web
      - lsp-server

  web:
    build:
      context: ./web-app
      args:
        ODOO_URL: ${ODOO_URL}
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - ENABLE_DEVOPS=true
      - ENABLE_PER_USER_AUTH=1
      - TESTRUNNER_API_URL=http://testrunner-control:8765
      - RESULTS_DIR=/results
      - REDIS_URL=redis://redis:6379
    volumes:
      - test_results:/results

  lsp-server:
    build: ./lsp-server
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: odoo_base
    volumes:
      - /mnt/sda1/pg_testrunner_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d odoo_base"]
      interval: 10s
      timeout: 2s
      retries: 5

  redis:
    image: redis:7-alpine

  testrunner-control:
    build: ./auto-testrunner
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ./.env
    environment:
      - ROLE=control
      - REDIS_URL=redis://redis:6379
      - RESULTS_DIR=/results
      - ENABLE_TEST01_INIT_TEST=1
    volumes:
      - test_results:/results
      - ./dump-test-01:/opt/dump-test-01:ro

  testrunner-worker:
    build: ./auto-testrunner
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ./.env
    environment:
      - ROLE=worker
      - REDIS_URL=redis://redis:6379
      - RESULTS_DIR=/results
      - ENABLE_TEST01_INIT_TEST=1
    volumes:
      - test_results:/results
    deploy:
      replicas: 2

volumes:
  test_results:
