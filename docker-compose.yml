services:
  gateway:
    image: nginx:alpine
    ports:
      - "${PORT}:80"
    environment:
      PORT: ${PORT}
    volumes:
      - ./nginx.conf:/etc/nginx/templates/nginx.conf.template
      - /dev/null:/etc/nginx/conf.d/default.conf
    depends_on:
      - web

  web:
    build:
      context: ./web-app
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - TESTRUNNER_API_URL=http://testrunner-control:8765
      - RESULTS_DIR=/results
      - REDIS_URL=redis://redis:6379
    volumes:
      - test_results:/results

  postgres:
    image: postgres:17
    shm_size: 1gb
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=12GB"
      - "-c"
      - "effective_cache_size=32GB"
      - "-c"
      - "maintenance_work_mem=1GB"
      - "-c"
      - "work_mem=32MB"
      - "-c"
      - "max_connections=200"
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: odoo_base
    ports:
      - "5432:5432"
    volumes:
      - /mnt/sda1/pg_testrunner_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d odoo_base"]
      interval: 10s
      timeout: 2s
      retries: 5

  redis:
    image: redis:7-alpine

  # Off-the-shelf trace viewer for the local Odoo instance's opt-in request tracing (see
  # auto-testrunner/profiling/). Not started by a plain `docker compose up` — bring it up
  # explicitly with `docker compose --profile debug up -d jaeger` when investigating a slow
  # call. In-memory storage: traces are ephemeral and don't need to survive a restart.
  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # UI
      - "4318:4318" # OTLP HTTP receiver
    profiles: ["debug"]

  testrunner-control:
    build: ./auto-testrunner
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ./.env
    environment:
      - ROLE=control
      - REDIS_URL=redis://redis:6379
      - RESULTS_DIR=/results
      - ENABLE_TEST01_INIT_TEST=1
      - TEST01_POOL_SIZE=5
    ports:
      - "8069:8069"
    volumes:
      - test_results:/results
      - ./dump-test-01:/opt/dump-test-01:ro
      - ./dump-test-02:/opt/dump-test-02:ro
      - ${LOCAL_ADDONS_HOST_PATH}:/opt/local-code:ro

  testrunner-worker:
    build: ./auto-testrunner
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ./.env
    environment:
      - ROLE=worker
      - REDIS_URL=redis://redis:6379
      - RESULTS_DIR=/results
      - ENABLE_TEST01_INIT_TEST=1
    volumes:
      - test_results:/results
    deploy:
      replicas: 3

volumes:
  test_results:
